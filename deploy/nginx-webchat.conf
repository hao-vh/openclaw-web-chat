# OpenClaw Web Chat Nginx 反向代理配置
# 将此文件放到 /etc/nginx/sites-available/ 并链接到 sites-enabled/
#
# 使用方式:
#   sudo cp nginx-webchat.conf /etc/nginx/sites-available/webchat
#   sudo ln -s /etc/nginx/sites-available/webchat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# WebSocket 升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chat.xiaowu-iot.com;  # 改成你的子域名

    # 自动跳转 HTTPS（如果有 SSL 证书）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.xiaowu-iot.com;  # 改成你的子域名

    # SSL 证书（根据实际路径修改）
    ssl_certificate     /etc/nginx/ssl/chat.xiaowu-iot.com.pem;
    ssl_certificate_key /etc/nginx/ssl/chat.xiaowu-iot.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 允许 iframe 嵌入
    # 如果只允许你的网站嵌入，改为: add_header X-Frame-Options "ALLOW-FROM https://xiaowu-iot.com";
    add_header X-Frame-Options "ALLOWALL";
    add_header Content-Security-Policy "frame-ancestors https://xiaowu-iot.com https://*.xiaowu-iot.com";

    # WebSocket 代理 (/ws)
    location /ws {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # WebSocket 长连接超时
        proxy_send_timeout 86400s;
    }

    # API 和页面代理
    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 头 - 允许你的网站跨域请求
        add_header Access-Control-Allow-Origin "https://xiaowu-iot.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}
